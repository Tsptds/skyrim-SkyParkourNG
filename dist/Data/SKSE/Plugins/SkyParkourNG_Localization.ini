[MCM_Info]
OnOff = Approach a ledge and press the parkour key to perform a parkour action.
Indicator = Show ledge indicators for Ledges & Vaultables. Red indicates not having enough stamina.
PlaybackSpeed = Change the animation playback speed multiplier. This doesn't affect crouch slide.
CrouchSlide = While sprinting, press the sneak key to slide into sneaking.

UsePresetKey = Use a key from game's control map. Allows seamless keyboard/gamepad transition. Custom key doesn't support this feature.
CustomKey = Change the Custom Parkour Key
Delay = Buffer parkour input. Using a non-zero delay with the 'Jump Preset Key' buffers the jump until threshold is passed. Tap to jump, hold to parkour.

StaminaSystem = Parkour actions consume stamina. 'High' & 'Highest' consume full, 'Medium', 'Low', 'Vault', 'Grab' consume half of the stamina damage option. 'Steps' do not consume stamina regardless.
MustHaveStamina = In case of insufficient stamina, 'High' & 'Highest' climbing actions will play a 'Fail' animation instead. Disabling this will turn stamina system into more of a cosmetic feature.
StaminaCost = Base consumption value (x). Formula is x + (Equipment Weight) * 0.2. The more items you equip, the higher the cost is.

SmartSteps = 'Steps' will only work when moving.
SmartVault = 'Vault' will only work when moving.
SmartClimb = 'High' & 'Highest' climb will only work when standing still. Also applies to 'Fail' if 'Must Have Stamina' option is enabled.

